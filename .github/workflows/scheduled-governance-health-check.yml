name: Scheduled Governance Health Check

on:
  schedule:
    # Midnight Asia/Tehran (UTC+03:30); GitHub schedules are UTC.
    - cron: "30 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-governance-health-check
  cancel-in-progress: false

jobs:
  mainline-health:
    name: Mainline health gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout mainline
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Run runtime smoke tests
        run: python -m runtime.test_runner

      - name: Run complete unittest suite
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run mandatory Bug Hunt governance contract tests
        run: python -m unittest tests/test_bug_hunting_gate.py -v

      - name: Publish fail-closed health summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          CHECKED_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          {
            echo "## Scheduled Governance Health Check"
            echo
            echo "- Event: \`$EVENT_NAME\`"
            echo "- Workflow checkout target: \`main\`"
            echo "- Workflow event SHA: \`$CHECKED_SHA\`"
            echo "- Gate result: **$JOB_STATUS**"
            echo
            if [ "$JOB_STATUS" = "success" ]; then
              echo "Health checks completed successfully. This result covers runtime smoke tests, the unittest suite, and Bug Hunt governance contract tests only."
            else
              echo "BLOCKED: at least one health check failed or was cancelled. Do not treat this run as Green; inspect failed steps and perform Bug Hunting before advancing any project gate."
            fi
            echo
            echo "This workflow is read-only: it does not edit files, merge PRs, unlock H-stages, or replace exact-head PR gates and required regressions."
          } >> "$GITHUB_STEP_SUMMARY"
