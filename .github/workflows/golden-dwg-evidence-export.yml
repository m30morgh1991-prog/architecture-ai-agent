name: Read-only Golden DWG Evidence Export

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'runtime/export_golden_dwg_evidence.py'
      - 'runtime/dwg_semantic_evidence.py'
      - 'test-assets/golden-projects/**'
      - 'test-assets/golden-understanding/golden_manifest.json'
      - '.github/workflows/golden-dwg-evidence-export.yml'

permissions:
  contents: read

jobs:
  export-evidence:
    name: Export evidence without modifying Golden DWGs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt
      - name: Extract read-only DWG evidence and verify hashes
        run: python -m runtime.export_golden_dwg_evidence
      - name: Upload evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: golden-dwg-evidence-${{ github.sha }}
          path: artifacts/golden-dwg-evidence/
          if-no-files-found: error
          retention-days: 14
