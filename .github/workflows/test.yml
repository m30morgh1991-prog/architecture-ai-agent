name: Runtime Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run runtime smoke tests
        run: python runtime/test_runner.py

      - name: Run unittest suite
        run: python -m unittest discover -s tests -p "test_*.py" -v
