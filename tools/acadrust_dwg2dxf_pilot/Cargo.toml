[package]
name = "acadrust-dwg2dxf-pilot"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[dependencies]
# Exact pilot pin. Do not add this crate to the production runtime dependencies.
acadrust = { version = "=0.6.8", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = true
codegen-units = 1
